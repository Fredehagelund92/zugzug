name: zugzug

# One-command demo. `docker compose up` → http://localhost:8080
# Password auth (first signup = admin), demo reference tables seeded, plus a
# bundled local DuckDB warehouse so the source catalog is browsable and scannable.
# For a real self-host: set SEED_DEMO=false, supply your own ORIGIN, and wire your
# own warehouse (e.g. WAREHOUSE_ADAPTER=motherduck + MOTHERDUCK_TOKEN).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zugzug
      POSTGRES_PASSWORD: zugzug
      POSTGRES_DB: zugzug
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zugzug -d zugzug"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build: ./server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://zugzug:zugzug@postgres:5432/zugzug
      PORT: "8787"
      # Bundled local DuckDB warehouse — bootstrap generates the file on first boot
      # (idempotent; survives the Postgres-only demo reset) and the seed wires its
      # columns as scannable sources. No MotherDuck token needed.
      ATTACH_WAREHOUSE: "true"
      WAREHOUSE_ADAPTER: "duckdb"
      DUCK_WAREHOUSE_PATH: /data/demo.duckdb
      SEED_DEMO: "true"
      ORIGIN: http://localhost:8080
      ZUGZUG_SELF_HOSTED: "1"
      # Demo mode: surface the one-click login on the sign-in page so visitors
      # land straight in the seeded workspace (no signup). Drop this for a real
      # self-host — it grants admin access without a password.
      DEV_BYPASS_AUTH: "true"
      ZUGZUG_DATA_DIR: /data
      WEBHOOKS_ENABLED: "1"
    volumes:
      - serverdata:/data
    # Healthcheck comes from server/Dockerfile (bun-based probe). app gates on
    # `condition: service_healthy` below.

  app:
    build: ./app
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
  serverdata:
