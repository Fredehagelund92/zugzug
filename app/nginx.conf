# ── Per-IP throttle for the password endpoints ────────────────────────────────
# The server already limits these per ACCOUNT (ZUGZUG_AUTH_RPM), which stops
# guessing at one account but not a spray across thousands of addresses — every
# request stays under its own account's budget. This is the other half, and it
# belongs here because nginx is the only layer with a client address worth
# trusting.
#
# Only the three endpoints that run argon2 are counted. /api/auth/me and
# /api/auth/config are fetched on every page load and cost nothing, so throttling
# them would break busy pages for no security gain. An empty key disables the
# limit for a request, which is how the map excludes them.
map $request_uri $auth_throttle_key {
  default                                       "";
  ~^/api/auth/(login|signup|change-password)    $binary_remote_addr;
}

# $binary_remote_addr is the DIRECT peer. When another proxy sits in front (a
# cloud edge, a load balancer) every user arrives carrying that proxy's address
# and would share one bucket — which turns this into a way to lock everyone out
# at once. Set TRUSTED_PROXY_CIDR to that proxy's range and the real client
# address is recovered from X-Forwarded-For instead. The default trusts only
# loopback, i.e. "nginx is the edge", which is the compose topology.
set_real_ip_from ${TRUSTED_PROXY_CIDR};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $auth_throttle_key zone=authlimit:10m rate=${AUTH_RATE_LIMIT};
# Match what the app itself answers when its per-account budget is spent, so a
# client sees one status for "slow down" regardless of which layer said it.
limit_req_status 429;

server {
  listen 80;
  # Also bind IPv6 — platforms with IPv6-only internal networking (e.g. Railway)
  # reach the container over IPv6; without this the healthcheck can't connect.
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve the API upstream at runtime. ${NGINX_RESOLVER} is the platform DNS:
  # 127.0.0.11 (Docker Compose embedded DNS, the image default) or Railway's
  # private-network resolver [fd12::10] (IPv6 must be bracketed). Paired with a
  # variable in proxy_pass below, this makes nginx re-query DNS instead of caching
  # the backend IP at startup — so a backend redeploy (new private IP) doesn't
  # strand a stale address. valid=1s keeps the re-resolve window tight.
  resolver ${NGINX_RESOLVER} valid=1s;

  # Reverse-proxy the API to the backend service. ${API_UPSTREAM} and
  # ${NGINX_RESOLVER} are substituted at container start (NGINX_ENVSUBST_FILTER);
  # every other $-variable here is an nginx runtime variable and must survive
  # envsubst. The `set` + variable proxy_pass is what triggers runtime resolution.
  location /api {
    # No-op for every request the map leaves with an empty key.
    limit_req zone=authlimit burst=20 nodelay;
    set $api_upstream ${API_UPSTREAM};
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Presence/awareness WebSocket.
  location /ws {
    set $ws_upstream ${API_UPSTREAM};
    proxy_pass http://$ws_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The favicon ships under a fixed name, so it must not inherit the 1y
  # immutable rule below — that would strand a rebranded mark in caches. An
  # exact-match location outranks the regex one.
  location = /favicon.svg {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  # Long-cache the hashed asset bundles; never cache index.html.
  location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
