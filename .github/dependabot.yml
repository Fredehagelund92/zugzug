# Dependabot version updates.
#
# NOTE: the server/, app/, and e2e/ workspaces use Bun (bun.lock). Dependabot's
# npm ecosystem can't regenerate bun.lock in a way that satisfies
# `bun install --frozen-lockfile`, so every PR it opens for those workspaces
# fails CI. They are intentionally excluded here — update Bun deps manually with
# `bun update` (Dependabot *alerts* still flag vulnerable Bun deps regardless).
#
# Only ecosystems Dependabot maintains cleanly are enabled: docs-site (npm /
# package-lock.json), GitHub Actions, and Docker base images.
version: 2
updates:
  # docs-site uses npm (package-lock.json), which Dependabot maintains correctly.
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 3
    groups:
      docs-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/server"
    schedule: { interval: "weekly" }
  - package-ecosystem: "docker"
    directory: "/app"
    schedule: { interval: "weekly" }
