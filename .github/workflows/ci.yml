name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test:coverage
      - name: Normalize app lcov paths
        run: bash "$GITHUB_WORKSPACE/scripts/normalize-lcov.sh" coverage/lcov.info app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-app
          path: app/coverage/lcov.info
      - name: License check (app deps)
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/run-license-check.sh app

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zugzug
          POSTGRES_PASSWORD: zugzug
          POSTGRES_DB: zugzug_test
        ports:
          - "55432:5432"
        options: >-
          --health-cmd "pg_isready -U zugzug"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - name: Apply migrations to test DB
        run: bun run drizzle/migrate.ts
        env:
          DATABASE_URL: postgres://zugzug:zugzug@localhost:55432/zugzug_test
          MOTHERDUCK_TOKEN: dummy-for-ci
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
          ATTACH_WAREHOUSE: "false"
      - run: bun run test:coverage
        env:
          DATABASE_URL: postgres://zugzug:zugzug@localhost:55432/zugzug_test
          MOTHERDUCK_TOKEN: dummy-for-ci
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
          ATTACH_WAREHOUSE: "false"
          ZUGZUG_CURSOR_KEY: lhpj7+vHLZDQJXKzZXiC/Qa/m2SNY3ObTBgxn7Awis8=
      - name: Normalize server lcov paths
        run: bash "$GITHUB_WORKSPACE/scripts/normalize-lcov.sh" coverage/lcov.info server
      # Bun's coverage marks comments and multi-line statement continuations as
      # measurable-but-unhit, which diff-cover then counts against patch
      # coverage. The app's v8 reporter doesn't, so this is server-only.
      - name: Drop non-executable lines from server lcov
        run: bun "$GITHUB_WORKSPACE/scripts/prune-lcov.ts" coverage/lcov.info "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-server
          path: server/coverage/lcov.info
      - name: License check (server deps)
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/run-license-check.sh server

  # Guards the one-command self-host path: builds the images and boots the full
  # `docker compose up` demo stack, then smoke-tests it end to end. Catches
  # Dockerfile / nginx-proxy / compose regressions that the unit suites can't
  # (e.g. the wget-healthcheck and missing /api proxy bugs both shipped unseen).
  docs-site:
    # docs-site was invisible to CI until #227 proposed a TypeScript major bump
    # that green-ticked here while actually breaking the build. `next build`
    # typechecks, so it catches that class of change.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run types:check
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the stack
        run: docker compose up --build -d
      - name: Wait for the stack to become reachable
        run: |
          # Poll the API *through nginx* (:8080), not just the server container's
          # docker health — otherwise the smoke curls can hit nginx in the
          # ~100ms before its workers accept connections and fail spuriously.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health 2>/dev/null | grep -q '"ok":true'; then
              echo "stack reachable"; exit 0
            fi
            sleep 5
          done
          echo "::error::stack did not become reachable within 5 minutes"
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Smoke — API health through nginx
        run: curl -fsS http://localhost:8080/api/health | grep -q '"ok":true'
      - name: Smoke — SPA is served
        run: curl -fsS http://localhost:8080/ | grep -q '<title'
      - name: Smoke — demo tables were seeded
        run: |
          docker compose exec -T postgres \
            psql -U zugzug -d zugzug -tAc "select count(*) from zugzug_app.reference_table" \
            | grep -qE '^[1-9]'
      # #217 — the reset must work while the server holds the DuckDB warehouse.
      # Before the read-only attach it refused here, leaving a duckdb demo with
      # no unattended reset.
      - name: Smoke — demo reset runs with the server up
        run: |
          docker compose exec -T -e DEMO_RESET_CONFIRM=yes server bun run demo-reset
      - name: Smoke — data is back after the reset
        run: |
          docker compose exec -T postgres \
            psql -U zugzug -d zugzug -tAc "select count(*) from zugzug_app.reference_table" \
            | grep -qE '^[1-9]'
      - name: Smoke — API health through nginx after the reset
        run: |
          curl -fsS http://localhost:8080/api/health | grep -q '"ok":true'
      - name: Smoke — first signup succeeds and becomes admin
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8080/api/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123","name":"CI Admin"}')"
          test "$code" = "200" || { echo "::error::signup returned $code, expected 200"; exit 1; }
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Teardown
        if: always()
        run: docker compose down -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the stack (with e2e override)
        run: docker compose -f compose.yml -f compose.e2e.yml up --build -d
      - name: Wait for stack to become healthy
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/health 2>/dev/null | grep -q '"ok":true'; then
              echo "stack healthy"; break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/health | grep -q '"ok":true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install e2e deps
        working-directory: e2e
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: e2e
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: e2e
        run: bunx playwright test
      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f compose.yml -f compose.e2e.yml logs --no-color
      - name: Teardown
        if: always()
        run: docker compose -f compose.yml -f compose.e2e.yml down -v

  license-placeholder-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check LICENSE placeholder
        run: bash scripts/check-license-placeholder.sh

  # On PRs: fail the check if NOTICE.md is stale — contributors fix it themselves.
  notice-up-to-date:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install deps (server)
        working-directory: server
        run: bun install --frozen-lockfile
      - name: Install deps (app)
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Regenerate NOTICE.md
        run: bash scripts/generate-notice.sh
      - name: Check NOTICE.md is current
        run: git diff --exit-code NOTICE.md

  # On push to main: auto-regenerate NOTICE.md and commit if it drifted.
  # Avoids contributors having to update NOTICE in a follow-up PR after their
  # dependency change merged. Skips itself when the bot is the committer.
  notice-auto-regen:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need full history + a writable token so we can push back.
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install deps (server)
        working-directory: server
        run: bun install --frozen-lockfile
      - name: Install deps (app)
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Regenerate NOTICE.md
        run: bash scripts/generate-notice.sh
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain NOTICE.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add NOTICE.md
            git commit -m "chore(notice): auto-regen after dependency change"
            git push
          else
            echo "NOTICE.md already up to date."
          fi

  coverage-gate:
    needs: [app, server]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-app
          path: cov-app
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-server
          path: cov-server
      - name: Install diff-cover
        run: pipx install diff-cover
      - name: Patch coverage report
        run: |
          # Full fetch (not --depth=1): diff-cover's three-dot compare needs a
          # merge base, which a shallow fetch of the base branch doesn't provide
          # ("fatal: origin/main...HEAD: no merge base").
          git fetch --no-tags origin "${{ github.base_ref }}"
          # 85, not 80: pruning non-executable lines from the server report
          # removes lines that were systematically counted as misses, so the
          # same diff now scores 15-20 points higher. 80 post-prune is a
          # weaker bar than 80 was before it. See scripts/prune-lcov.ts.
          diff-cover cov-app/lcov.info cov-server/lcov.info \
            --compare-branch "origin/${{ github.base_ref }}" \
            --fail-under 85 \
            --format "markdown:patch-coverage.md"
          echo "## Patch coverage" >> "$GITHUB_STEP_SUMMARY"
          cat patch-coverage.md >> "$GITHUB_STEP_SUMMARY"
