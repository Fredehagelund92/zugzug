name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - name: License check (app deps)
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/run-license-check.sh app

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zugzug
          POSTGRES_PASSWORD: zugzug
          POSTGRES_DB: zugzug_test
        ports:
          - "55432:5432"
        options: >-
          --health-cmd "pg_isready -U zugzug"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - name: Apply migrations to test DB
        run: bun run drizzle/migrate.ts
        env:
          DATABASE_URL: postgres://zugzug:zugzug@localhost:55432/zugzug_test
          MOTHERDUCK_TOKEN: dummy-for-ci
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
          ATTACH_WAREHOUSE: "false"
      - run: bun run test
        env:
          DATABASE_URL: postgres://zugzug:zugzug@localhost:55432/zugzug_test
          MOTHERDUCK_TOKEN: dummy-for-ci
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
          ATTACH_WAREHOUSE: "false"
      - name: License check (server deps)
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/run-license-check.sh server

  # Guards the one-command self-host path: builds the images and boots the full
  # `docker compose up` demo stack, then smoke-tests it end to end. Catches
  # Dockerfile / nginx-proxy / compose regressions that the unit suites can't
  # (e.g. the wget-healthcheck and missing /api proxy bugs both shipped unseen).
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build -d
      - name: Wait for the server to become healthy
        run: |
          for i in $(seq 1 60); do
            health="$(docker compose ps server --format '{{.Health}}' 2>/dev/null || true)"
            if [ "$health" = "healthy" ]; then echo "server healthy"; exit 0; fi
            sleep 5
          done
          echo "::error::server did not become healthy within 5 minutes"
          docker compose ps
          exit 1
      - name: Smoke — API health through nginx
        run: curl -fsS http://localhost:8080/api/health | grep -q '"ok":true'
      - name: Smoke — SPA is served
        run: curl -fsS http://localhost:8080/ | grep -q '<title'
      - name: Smoke — demo dimensions were seeded
        run: |
          docker compose exec -T postgres \
            psql -U zugzug -d zugzug -tAc "select count(*) from zugzug_app.dimension" \
            | grep -qE '^[1-9]'
      - name: Smoke — first signup succeeds and becomes admin
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8080/api/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123","name":"CI Admin"}')"
          test "$code" = "200" || { echo "::error::signup returned $code, expected 200"; exit 1; }
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Teardown
        if: always()
        run: docker compose down -v

  license-placeholder-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check LICENSE placeholder
        run: bash scripts/check-license-placeholder.sh

  # On PRs: fail the check if NOTICE.md is stale — contributors fix it themselves.
  notice-up-to-date:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps (server)
        working-directory: server
        run: bun install --frozen-lockfile
      - name: Install deps (app)
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Regenerate NOTICE.md
        run: bash scripts/generate-notice.sh
      - name: Check NOTICE.md is current
        run: git diff --exit-code NOTICE.md

  # On push to main: auto-regenerate NOTICE.md and commit if it drifted.
  # Avoids contributors having to update NOTICE in a follow-up PR after their
  # dependency change merged. Skips itself when the bot is the committer.
  notice-auto-regen:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history + a writable token so we can push back.
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps (server)
        working-directory: server
        run: bun install --frozen-lockfile
      - name: Install deps (app)
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Regenerate NOTICE.md
        run: bash scripts/generate-notice.sh
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain NOTICE.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add NOTICE.md
            git commit -m "chore(notice): auto-regen after dependency change"
            git push
          else
            echo "NOTICE.md already up to date."
          fi
