[test]
# Force the test database before any test file's imports evaluate — see
# test/preload-env.ts for why the in-file process.env assignments are not enough.
preload = ["./test/preload-env.ts"]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coveragePathIgnorePatterns = [
  "test/",
  "drizzle/migrations/",
  "src/seed",
  "src/verify-",
  ".test.ts",
]
