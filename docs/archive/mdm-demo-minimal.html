<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Zugzug</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080b14;
    --surface: #0f1526;
    --ink: #eaeef7;
    --ink-2: #9ba7bf;
    --ink-3: #5b6884;
    --line: rgba(255,255,255,.10);
    --accent: #d6336c;
    --font-display: "Bricolage Grotesque", sans-serif;
    --font-body: "Hanken Grotesk", sans-serif;
    --font-mono: "JetBrains Mono", monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 var(--font-body);
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* tiny mark, top-left */
  header {
    padding: 22px 28px;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -0.02em;
    color: var(--ink-2);
  }

  /* center stage */
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }

  .question {
    width: 100%;
    max-width: 720px;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(30px, 4.4vw, 44px);
    letter-spacing: -0.025em;
    line-height: 1.1;
    margin: 0 0 40px;
    text-align: center;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .choice {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 28px 26px;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color .15s, transform .15s;
  }
  .choice:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .choice:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .choice .value {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    letter-spacing: -0.015em;
    line-height: 1.15;
    margin-bottom: 8px;
  }
  .choice .sub {
    color: var(--ink-2);
    font-size: 14.5px;
    line-height: 1.45;
    margin-bottom: 26px;
  }
  .choice .source {
    font: 500 12px/1 var(--font-mono);
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.18em;
  }

  /* one tiny escape */
  .skip {
    margin-top: 28px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-3);
  }
  .skip a {
    color: var(--ink-3);
    text-decoration: none;
    border-bottom: 1px dotted var(--ink-3);
    padding-bottom: 1px;
    cursor: pointer;
  }
  .skip a:hover { color: var(--ink); border-color: var(--ink); }

  /* whisper-quiet footer */
  footer {
    padding: 22px 28px;
    font: 500 11px/1 var(--font-mono);
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.22em;
    text-align: center;
  }
</style>
</head>
<body>

  <header>zugzug</header>

  <main>
    <div class="question">
      <h1>Which address is right for Acme Corp.?</h1>

      <div class="choices">
        <button class="choice">
          <div class="value">Berlin, Germany</div>
          <div class="sub">Friedrichstr. 200, 10117 Berlin</div>
          <div class="source">From HubSpot</div>
        </button>

        <button class="choice">
          <div class="value">San Mateo, California</div>
          <div class="sub">1 Acme Plaza, CA 94402</div>
          <div class="source">From NetSuite</div>
        </button>
      </div>

      <div class="skip"><a>Skip this one</a></div>
    </div>
  </main>

  <footer>9 more after this</footer>

</body>
</html>
